# Clean-room compilation on a real, isolated Mac. The checked-out repo is mounted
# read-only, build artifacts go to the throwaway VM, and the VM is destroyed after
# every job. Hosted CI owns the XCTest suite; this job proves the pinned dependency
# graph and release build work from a cold macOS environment.
#
# A true microphone → model → paste check still requires a purpose-built image
# with audio input and TCC permissions. Do not call this an end-to-end test until
# it exercises that path.
#
# SAFETY: push-to-main only, never pull_request. Untrusted fork code must not run
# on the self-hosted runner.
name: Clean-room macOS build

on:
  push:
    branches: [main]

jobs:
  selftest:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: whisperown checks inside a fresh, throwaway VM
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          VM="ci-${GITHUB_RUN_ID}"

          # Always destroy the VM, even if the checks fail.
          cleanup() { tart stop "$VM" 2>/dev/null || true; tart delete "$VM" 2>/dev/null || true; }
          trap cleanup EXIT

          # Fresh clone of the clean base image; mount the checked-out repo read-only.
          tart clone base "$VM"
          nohup tart run "$VM" --no-graphics --dir=repo:"$GITHUB_WORKSPACE":ro \
            >/tmp/"$VM".log 2>&1 </dev/null &

          # Wait for the VM's IP. `|| true` so the first (expected) miss doesn't trip `bash -e`.
          IP=""
          for i in $(seq 1 60); do IP=$(tart ip "$VM" 2>/dev/null || true); [ -n "$IP" ] && break; sleep 2; done
          if [ -z "$IP" ]; then echo "VM never got an IP"; exit 1; fi
          echo "VM booted at $IP"

          # Run the real checks INSIDE the VM, against the mounted repo. Password-only auth
          # (PubkeyAuthentication=no) avoids "too many auth failures" when keys are present.
          sshpass -p admin ssh \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            admin@"$IP" '
              set -e
              cd "/Volumes/My Shared Files/repo"
              echo "in-VM: $(hostname) / macOS $(sw_vers -productVersion)"

              echo "--- [1/3] clean-room release build (SwiftPM) ---"
              # Repo is mounted read-only, so send build artifacts to a writable path.
              swift build -c release --build-path /tmp/wo-build
              echo "    OK: native app builds in a clean VM"

              echo "--- [2/3] installer and bundle metadata ---"
              bash -n install.sh
              bash -n build.sh
              plutil -lint Info.plist
              test -x install.sh
              test -x build.sh
              echo "    OK: source installer inputs are valid"

              echo "--- [3/3] native wiring present ---"
              for f in Package.swift Package.resolved Sources/FluidTranscriber.swift \
                       Sources/Postprocessor.swift Sources/HistoryStore.swift \
                       Sources/ModelDownloadWindow.swift build.sh install.sh; do
                if [ -f "$f" ]; then echo "    OK: $f"; else echo "    MISSING: $f"; exit 1; fi
              done
              echo "ALL CLEAN-ROOM CHECKS PASSED"
            '
